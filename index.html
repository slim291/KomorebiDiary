<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="こもれび日記">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>こもれび日記</title>
  <style>
    :root{--paper:#f7f4ee;--ink:#28352d;--muted:#788178;--green:#53745d;--line:#e8e4db;--white:#fffefa;--pale:#e8eee5;--sat:#4373b1;--sun:#be4c48;--holiday:#be7d2a}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
    .app{max-width:720px;margin:auto;padding:0 18px max(28px,env(safe-area-inset-bottom))}.top{padding:26px 2px 17px;display:flex;align-items:center;gap:12px}.mark{width:43px;height:43px;border-radius:15px;background:#e4ebdf;display:grid;place-items:center;font-size:22px}.brand h1{font-size:19px;letter-spacing:.06em;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.hero{background:var(--pale);border-radius:21px;padding:17px 19px;margin-bottom:17px}.hero .date{font-size:12px;color:#67776a;letter-spacing:.04em}.hero h2{font-size:21px;font-weight:600;margin:7px 0 5px}.hero p{font-size:12px;color:#647268;margin:0}
    .calendar{background:var(--white);border:1px solid #eeeae1;border-radius:20px;padding:12px 11px 11px;box-shadow:0 3px 12px #43534308}.monthbar{height:44px;display:flex;align-items:center;justify-content:space-between}.monthbar h3{font-size:16px;margin:0}.navmonth{width:40px;height:38px;border:0;background:transparent;border-radius:12px;font-size:25px;color:var(--green)}.navmonth:active{background:var(--pale)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekday{font-size:11px;color:var(--muted);padding:7px 0 5px}.weekday.sun{color:var(--sun)}.weekday.sat{color:var(--sat)}.day{height:48px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;color:var(--ink);padding:0}.day.sun{color:var(--sun)}.day.sat{color:var(--sat)}.day.holiday{color:var(--holiday);font-weight:650}.day.selected{background:var(--pale);font-weight:750}.day .marknote{height:15px;font-size:11px;color:var(--green);line-height:15px}.day.empty{pointer-events:none}.legend{display:flex;justify-content:center;gap:16px;padding:7px 0 0;font-size:10px}.legend span{white-space:nowrap}.legend .sun{color:var(--sun)}.legend .sat{color:var(--sat)}.legend .holiday{color:var(--holiday)}
    .selected-area{margin:17px 1px 20px}.selected-head{font-size:15px;font-weight:700;margin:0 0 9px}.note-card{background:var(--white);border:1px solid #eeeae1;border-radius:16px;padding:13px 15px;white-space:pre-wrap;line-height:1.7;font-size:14px;overflow-wrap:anywhere}.note-card .note-title{font-weight:700;margin-bottom:3px}.note-card .mood{margin-right:7px}.empty-note{color:var(--muted);font-size:12px;padding:4px 1px 0}.write-btn{width:100%;height:49px;border:0;border-radius:999px;background:var(--green);color:white;font-weight:650;margin-top:10px;box-shadow:0 4px 14px #334c3820}.section-head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.section-head h3{margin:0;font-size:15px}.count{font-size:11px;color:var(--muted)}.entries{display:grid;gap:9px}.entry{width:100%;border:1px solid #eeeae1;background:var(--white);border-radius:16px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:42px 1fr 16px;gap:11px;align-items:center}.entry .emoji{width:42px;height:42px;background:#f2f0e9;border-radius:13px;display:grid;place-items:center;font-size:21px}.entry .date{font-size:10px;color:var(--muted);margin-bottom:3px}.entry .title{font-size:14px;font-weight:650;margin-bottom:3px}.entry .preview{font-size:11px;color:#7d837c;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.arrow{color:#a1a79f}.empty-list{text-align:center;padding:25px 12px;color:var(--muted);font-size:12px;background:#fbfaf6;border-radius:15px}
    .overlay{position:fixed;inset:0;background:#18231dcc;display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.open{display:flex}.sheet{width:min(100%,720px);height:min(92dvh,850px);background:var(--paper);border-radius:25px 25px 0 0;padding:15px 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;box-shadow:0 -10px 40px #0002}.sheetbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.textbtn{border:0;background:none;color:var(--muted);padding:9px 2px}.save{border:0;border-radius:999px;background:var(--green);color:white;padding:10px 18px;font-weight:650}.sheet h2{font-size:18px;margin:0 0 4px}.sheet .sub{font-size:12px;color:var(--muted);margin:0 0 15px}.moods{display:flex;gap:8px;margin-bottom:14px}.moodpick{border:1px solid var(--line);background:var(--white);width:43px;height:43px;border-radius:13px;font-size:21px}.moodpick.selected{border:2px solid var(--green);background:var(--pale)}.titleinput{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 2px;font-size:16px;outline:0;color:var(--ink)}textarea{margin-top:12px;flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.85;padding:5px 2px}.sheetfoot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;color:var(--muted);font-size:10px}.delete{border:0;background:none;color:#a7685b;padding:8px}.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#28352d;color:white;padding:10px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}.toast.show{opacity:1}
    @media(min-width:600px){.app{padding-top:12px}.overlay{align-items:center;padding:20px}.sheet{height:min(88vh,780px);border-radius:25px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="mark">🌿</div><div class="brand"><h1>こもれび日記</h1><p>今日の気持ちを、ひとことから。</p></div></header>
    <section class="hero"><div id="todayLabel" class="date"></div><h2 id="greeting"></h2><p>小さなことも、あなたの大切な記録。</p></section>
    <section class="calendar"><div class="monthbar"><button class="navmonth" id="prevMonth" aria-label="前の月">‹</button><h3 id="monthTitle"></h3><button class="navmonth" id="nextMonth" aria-label="次の月">›</button></div><div class="grid" id="calendarGrid"></div><div class="legend"><span class="sun">● 日曜</span><span class="sat">● 土曜</span><span class="holiday">● 祝日</span></div></section>
    <section class="selected-area"><h3 class="selected-head" id="selectedHead"></h3><div id="selectedNote"></div><button class="write-btn" id="writeBtn"></button></section>
    <section><div class="section-head"><h3>日々の記録</h3><span class="count" id="count"></span></div><div class="entries" id="entries"></div></section>
  </main>
  <div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="sheetbar"><button class="textbtn" id="cancelBtn">閉じる</button><button class="save" id="saveBtn">保存する</button></div><h2 id="formTitle">日記を書く</h2><p class="sub" id="formDate"></p><div class="moods" id="moods" aria-label="今日の気分"></div><input class="titleinput" id="titleInput" maxlength="50" placeholder="タイトル（なくても大丈夫）"><textarea id="bodyInput" placeholder="今日あったこと、感じたことを書いてみましょう…"></textarea><div class="sheetfoot"><span>日記はこの端末のブラウザーに保存されます</span><button class="delete" id="deleteBtn">削除</button></div></section></div>
  <div class="toast" id="toast"></div>
<script>
(()=>{
  const KEY='komorebi-diary-v1', faces=['😊','🙂','😌','😔','😣'], $=s=>document.querySelector(s), ink='#28352d';
  let records=load(), selectedDate=todayKey(), visibleMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), editingId=null, selectedMood=faces[0];
  function todayKey(){return keyOf(new Date())} function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function fromKey(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
  function fmt(s,weekday=true){return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',...(weekday?{weekday:'short'}:{})}).format(fromKey(s))}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}} function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function nthMonday(y,m,n){let first=new Date(y,m-1,1);return 1+((8-first.getDay())%7)+(n-1)*7}
  function springEquinox(y){return Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4))}
  function autumnEquinox(y){return Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4))}
  function japaneseHolidays(y){let h=new Set(),add=(m,d)=>h.add(keyOf(new Date(y,m-1,d)));
    add(1,1);add(1,y>=2000?nthMonday(y,1,2):15);add(2,11);add(2,23);add(3,springEquinox(y));add(4,29);add(5,3);add(5,4);add(5,5);
    if(y===2020){add(7,23);add(7,24);add(8,10)}else if(y===2021){add(7,22);add(7,23);add(8,8)}else{add(7,y>=2003?nthMonday(y,7,3):20);add(8,11)}
    add(9,y>=2003?nthMonday(y,9,3):15);add(9,autumnEquinox(y));
    if(y!==2020&&y!==2021)add(10,y>=2000?nthMonday(y,10,2):10);add(11,3);add(11,23);
    if(y===2019){add(5,1);add(10,22)}
    const national=new Set(h), citizens=new Set();for(let d=1;d<=new Date(y,1,0).getDate()+new Date(y,2,0).getDate()+new Date(y,3,0).getDate()+new Date(y,4,0).getDate()+new Date(y,5,0).getDate()+new Date(y,6,0).getDate()+new Date(y,7,0).getDate()+new Date(y,8,0).getDate()+new Date(y,9,0).getDate()+new Date(y,10,0).getDate()+new Date(y,11,0).getDate()+new Date(y,12,0).getDate();d++){let k=keyOf(new Date(y,0,d));if(!national.has(k)&&national.has(keyOf(new Date(y,0,d-1)))&&national.has(keyOf(new Date(y,0,d+1))))citizens.add(k)}
    citizens.forEach(x=>h.add(x));for(const k of national){let date=fromKey(k);if(date.getDay()===0){let sub=new Date(date);sub.setDate(sub.getDate()+1);while(h.has(keyOf(sub))&&sub.getFullYear()===y)sub.setDate(sub.getDate()+1);if(sub.getFullYear()===y)h.add(keyOf(sub))}}return h;
  }
  function render(){let y=visibleMonth.getFullYear(),m=visibleMonth.getMonth(),holidays=japaneseHolidays(y);$('#todayLabel').textContent=fmt(todayKey());$('#greeting').textContent=records.some(x=>x.date===todayKey())?'今日の記録、できています。':'今日を、書きとめる。';$('#monthTitle').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(visibleMonth);
    const grid=$('#calendarGrid');grid.innerHTML='';['日','月','火','水','木','金','土'].forEach((w,i)=>{let d=document.createElement('div');d.className='weekday'+(i===0?' sun':i===6?' sat':'');d.textContent=w;grid.append(d)});
    let offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),slots=Math.ceil((offset+days)/7)*7;
    for(let i=0;i<slots;i++){let day=i-offset+1;if(day<1||day>days){let blank=document.createElement('div');blank.className='day empty';grid.append(blank);continue}let d=new Date(y,m,day),key=keyOf(d),note=records.find(r=>r.date===key),btn=document.createElement('button');btn.type='button';btn.className='day'+(d.getDay()===0?' sun':d.getDay()===6?' sat':'')+(holidays.has(key)?' holiday':'')+(key===selectedDate?' selected':'');btn.setAttribute('aria-label',`${fmt(key)}${note?' 日記あり':''}`);btn.innerHTML=`<span>${day}</span><span class="marknote">${note?esc(note.mood):key===todayKey()?'•':' '}</span>`;btn.onclick=()=>{selectedDate=key;render()};grid.append(btn)}
    let chosen=records.find(x=>x.date===selectedDate);$('#selectedHead').textContent=`${fmt(selectedDate)} の日記`;$('#selectedNote').innerHTML=chosen?`<div class="note-card"><div class="note-title"><span class="mood">${esc(chosen.mood)}</span>${esc(chosen.title||'日記')}</div>${esc(chosen.body)}</div>`:'<div class="empty-note">この日の記録はまだありません。</div>';$('#writeBtn').textContent=chosen?'この日の日記を編集':'この日の日記を書く';$('#writeBtn').onclick=()=>openEditor(chosen?.id||null,selectedDate);
    let sorted=[...records].sort((a,b)=>a.date.localeCompare(b.date));$('#count').textContent=`${records.length}日分`;const host=$('#entries');host.innerHTML=sorted.length?sorted.map(x=>`<button class="entry" data-id="${esc(x.id)}"><span class="emoji">${esc(x.mood)}</span><span><span class="date">${fmt(x.date)}</span><span class="title">${esc(x.title||'日記')}</span><span class="preview">${esc(x.body)}</span></span><span class="arrow">›</span></button>`).join(''):'<div class="empty-list">日記はまだありません。カレンダーから日付を選んで書いてみましょう。</div>';host.querySelectorAll('.entry').forEach(el=>el.onclick=()=>{let x=records.find(r=>r.id===el.dataset.id);if(x){selectedDate=x.date;visibleMonth=new Date(fromKey(x.date).getFullYear(),fromKey(x.date).getMonth(),1);render();openEditor(x.id,x.date)}})
  }
  function openEditor(id,date){editingId=id;let item=records.find(x=>x.id===id);selectedMood=item?.mood||faces[0];$('#formTitle').textContent=item?'日記を編集':'日記を書く';$('#formDate').textContent=fmt(item?.date||date);$('#titleInput').value=item?.title||'';$('#bodyInput').value=item?.body||'';$('#deleteBtn').style.visibility=item?'visible':'hidden';drawMoods();$('#overlay').classList.add('open');setTimeout(()=>$('#bodyInput').focus({preventScroll:true}),100)}
  function drawMoods(){const host=$('#moods');host.innerHTML=faces.map(x=>`<button type="button" class="moodpick ${x===selectedMood?'selected':''}" aria-label="気分 ${x}" data-mood="${x}">${x}</button>`).join('');host.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedMood=b.dataset.mood;drawMoods()})}
  function closeEditor(){ $('#overlay').classList.remove('open') }
  function newId(){return globalThis.crypto?.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
  function save(){let body=$('#bodyInput').value.trim(),title=$('#titleInput').value.trim();if(!body&&!title){$('#bodyInput').focus();return}if(editingId){let item=records.find(x=>x.id===editingId);Object.assign(item,{title,body,mood:selectedMood})}else{let old=records.find(x=>x.date===selectedDate);if(old)Object.assign(old,{title,body,mood:selectedMood});else records.push({id:newId(),date:selectedDate,title,body,mood:selectedMood,created:Date.now()})}persist();render();closeEditor();toast('日記を保存しました')}
  function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
  $('#prevMonth').onclick=()=>{visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()-1,1);selectedDate=keyOf(visibleMonth);render()};$('#nextMonth').onclick=()=>{visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,1);selectedDate=keyOf(visibleMonth);render()};$('#cancelBtn').onclick=closeEditor;$('#saveBtn').onclick=save;$('#deleteBtn').onclick=()=>{if(!editingId)return;records=records.filter(x=>x.id!==editingId);persist();render();closeEditor();toast('日記を削除しました')};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeEditor()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#overlay').classList.contains('open'))save()});
  if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();
</script>
</body></html>
